<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>to do — open, a working list</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/todo/components/bundle.css">
<script src="ds/todo/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&amp;family=Shantell+Sans:wght@400;500;600&amp;display=swap">
<style>
body { margin: 0; font-family: var(--font-ui); background: var(--surface-desk); }
a { color: var(--pen-blue); } a:hover { color: var(--ink); }
</style>
</helmet>
<div style="width: 400px; height: 480px; box-sizing: border-box; position: relative; background: var(--surface-desk); overflow: hidden;">

  <div style="height: 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: flex-end; gap: 13px; padding: 0 13px; background: var(--surface-raised); color: var(--chrome-ink);">
    <x-import component-from-global-scope="ToDo.MenubarTrigger" open="{{yes}}" count="{{left}}" paper="paper-butter" label="to do"></x-import>
    <svg width="16" height="14" viewBox="0 0 16 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" style="flex: 0 0 auto;" aria-hidden="true"><path d="M1.4 4.6a9 9 0 0 1 13.2 0"/><path d="M3.9 7.4a5.6 5.6 0 0 1 8.2 0"/><path d="M6.3 10a2.4 2.4 0 0 1 3.4 0"/><circle cx="8" cy="12.4" r="0.7" fill="currentColor" stroke="none"/></svg>
    <svg width="15" height="14" viewBox="0 0 15 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" style="flex: 0 0 auto;" aria-hidden="true"><path d="M1.6 4h11.8"/><path d="M1.6 10h11.8"/><circle cx="5" cy="4" r="2" fill="var(--surface-raised)"/><circle cx="10" cy="10" r="2" fill="var(--surface-raised)"/></svg>
    <svg width="23" height="12" viewBox="0 0 23 12" fill="none" style="flex: 0 0 auto;" aria-hidden="true"><rect x="0.65" y="0.65" width="18.2" height="10.7" rx="3.2" stroke="currentColor" stroke-width="1.3"/><rect x="2.5" y="2.5" width="12" height="7" rx="1.8" fill="currentColor"/><path d="M21.1 4.3v3.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <span style="font-size: 12px; font-weight: 500; color: var(--chrome-ink); white-space: nowrap;">Mon 9:41</span>
  </div>

  <div style="position: absolute; top: 32px; left: 62px;">
    <x-import component-from-global-scope="ToDo.NotePanel" title="Today" meta="{{leftLabel}}" shortcut="⌘⇧T" tilt="left">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="6">
        <x-import component-from-global-scope="ToDo.TodoItem" text="{{item.text}}" done="{{item.done}}" pinned="{{item.pinned}}" on-toggle="{{item.toggle}}"></x-import>
      </sc-for>
      <x-import component-from-global-scope="ToDo.NewItemLine" value="{{draft}}" placeholder="write a line" label="write a line" on-change="{{onDraft}}" on-submit="{{onAdd}}"></x-import>
    </x-import>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":480}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      draft: '',
      lines: [
        { id: 1, text: 'ring the dentist back', pinned: true },
        { id: 2, text: 'hand in the moodboard' },
        { id: 3, text: 'buy grout for the bathroom' },
        { id: 4, text: 'reply to nikhil about the flat' },
        { id: 5, text: 'pick up prints', done: true },
        { id: 6, text: 'water the plants', done: true }
      ]
    };
  }

  toggle(id) {
    this.setState({
      lines: this.state.lines.map(function (x) {
        return x.id === id ? Object.assign({}, x, { done: !x.done }) : x;
      })
    });
  }

  renderVals() {
    var self = this;
    var lines = this.state.lines;
    var open = lines.filter(function (l) { return !l.done; });
    return {
      yes: true,
      left: open.length,
      leftLabel: open.length + ' left',
      items: lines.map(function (l) {
        return {
          text: l.text,
          done: !!l.done,
          pinned: !!l.pinned,
          toggle: function () { self.toggle(l.id); }
        };
      }),
      draft: this.state.draft,
      onDraft: function (e) { self.setState({ draft: e.target.value }); },
      onAdd: function (v) {
        var t = (v || '').trim();
        if (!t) { self.setState({ draft: '' }); return; }
        self.setState({
          lines: self.state.lines.concat([{ id: Date.now(), text: t }]),
          draft: ''
        });
      }
    };
  }
}
</script>
</body>
</html>
